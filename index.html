<body>

    <canvas id="rive-background" width="1200" height="1200"></canvas>
    
    <div class="container" id="container">
        <div class="form-box register">
            <form id="register-form">
                <h1>Register</h1>
                <p class="social-text">Use your email for registration</p>
                <div class="input-box">
                    <input type="text" id="register-name" placeholder="Name" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" id="register-email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="register-password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                 <p class="error-message" id="register-error"></p>
                <button type="submit" class="btn">Sign Up</button>
            </form>
        </div>

        <div class="form-box login">
            <form id="login-form">
                <h1>Sign In</h1>
                <div class="input-box">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                 <p class="error-message" id="login-error"></p>
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <p class="social-text">Or sign in with social platforms</p>
                <div class="social-icons">
                    <a href="#" class="social-google"><i class='bx bxl-google'></i></a>
                    <a href="#" class="social-github"><i class='bx bxl-github'></i></a>
                    <a href="#" class="social-facebook"><i class='bx bxl-facebook'></i></a>
                </div>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="btn" id="login-btn">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>Register with your personal details to get started</p>
                    <button class="btn" id="register-btn">Sign Up</button>
                </div>
            </div>
        </div>
